name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
  # The Go vulnerability database updates independently of code changes;
  # without a schedule, a new CVE goes unnoticed until the next PR.
  schedule:
    - cron: "0 1 * * *" # daily 10:00 JST

permissions:
  contents: read

concurrency:
  group: govulncheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    # govulncheck's call-graph analysis can pathologically stall against large
    # dependency graphs (observed: minutes of 100%+ CPU with zero output) when
    # the (unpinned) vulnerability DB or toolchain shifts. Without a bound, the
    # job either sits until GitHub's runner-communication watchdog kills it
    # after ~46 min, or gets cancelled a couple of minutes in with no useful
    # signal. Fail fast and unambiguously instead.
    timeout-minutes: 5
    steps:
      # The action checks out the repository itself (repo-checkout: true).
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # go-version-input defaults to "stable", which setup-go prefers over
          # go-version-file; empty it so the go.mod toolchain is what we scan
          # with. Scanning "stable" would mask stdlib vulns in local builds.
          go-version-input: ""
          go-version-file: go.mod
